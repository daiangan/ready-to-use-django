[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.coverage.run]
branch = true
source = ["api", "django_project", "settings", "utils"]
omit = [
    "*/migrations/*",
    "django_project/asgi.py",
    "django_project/wsgi.py",
    "settings/prod.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
